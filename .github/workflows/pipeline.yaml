name: Creatio CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-to-sit:
    name: Deploy workspace to SIT
    runs-on: self-hosted
    steps:
      - name: Show run context
        shell: powershell
        run: |
          Write-Host "Commit:  ${{ github.sha }}"
          Write-Host "Branch:  ${{ github.ref_name }}"
          Write-Host "Trigger: ${{ github.event_name }}"
          Write-Host "Actor:   ${{ github.actor }}"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push workspace to SIT
        shell: powershell
        run: clio pushw -e SIT

      - name: List environments (sanity)
        shell: powershell
        run: clio show-web-app-list --format table