name: Creatio CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Verify runner can reach Clio and see SIT
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show Clio version
        shell: powershell
        run: clio --version

      - name: List Clio-registered environments
        shell: powershell
        run: clio show-web-app-list --format table